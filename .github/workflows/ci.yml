name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 语法检查
        run: python -m compileall -q astrbot_plugin scripts

      - name: 插件结构 + 配置格式
        run: |
          # pillow：视觉回归要真缩图（透明底合成、巨图拒识），不装就测不了
          pip install --quiet pyyaml pillow
          python scripts/check_plugin.py

      - name: 隐私扫描
        run: python scripts/privacy_scan.py --all

      - name: 配置文档与 schema 一致
        run: python scripts/gen_config_doc.py --check

      - name: 顶层导出完整（拆分防丢）
        run: python scripts/check_exports.py
      - name: 类常量悬空检查（拆 Mixin 防丢）
        run: python scripts/check_class_attrs.py

      - name: 未定义名字检查
        run: python scripts/check_names.py

      - name: 开口判定行为测试
        run: python scripts/test_speak_decision.py

      - name: 收件人判定表（谁在跟谁说话）
        run: python scripts/test_addressee.py

      - name: 调度器（默认不说 + 发言率上限）
        run: python scripts/test_scheduler.py

      - name: 生成器（打字延迟 + 草稿重判）
        run: python scripts/test_generator.py

      - name: 调侃许可（三级/升降/ban/自嘲去重/禁区）
        run: python scripts/test_tease.py

      - name: 骂战分级（无指向的阴阳词不升级）
        run: python scripts/test_quarrel.py

      - name: 记忆出处（来源判定/可引用性/改述）
        run: python scripts/test_memory_source.py

      - name: 目的地记忆（说过几次/跨人跨群隔离/裁剪）
        run: python scripts/test_memory_said.py

      - name: 记忆纠错（改库/纠正记录/低置信度降级）
        run: python scripts/test_memory_correction.py

      - name: 记忆 P0（衰减幂等/召回算激活/缓存不串人/纠错归属）
        run: python scripts/test_memory_p0.py

      - name: 在场（什么算在场/配额/间隔）
        run: python scripts/test_presence.py

      - name: 排版归一化（空格/换行/句号/感叹号）
        run: python scripts/test_typeset.py

      - name: 静默开关（/off 后 /on 必须能叫回来）
        run: python scripts/test_mute_toggle.py

      - name: P1 回归（透明图/巨图/告状冷却/纠错阈值/印象落盘）
        run: python scripts/test_p1_fixes.py

      - name: P2 回归（谐音边界/冷场/时钟回拨/拆条字数/权限/炸弹边界）
        run: python scripts/test_p2_fixes.py

      - name: 戳一戳兜底（双回/静默不戳）
        run: python scripts/test_poke_fallback.py

      - name: 提示词预算（记忆块字数/条数上限）
        run: python scripts/test_prompt_budget.py

      - name: P3 回归（冷却位回滚/草稿重判/机器人消息/记忆去重/检索并发）
        run: python scripts/test_p3_fixes.py

      - name: 自检（纯函数，不联网）
        run: python astrbot_plugin/astrbot_plugin_fish/scripts/selfcheck.py
