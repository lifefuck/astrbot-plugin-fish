name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 语法检查
        run: python -m compileall -q astrbot_plugin scripts

      - name: 插件结构 + 配置格式
        run: |
          pip install --quiet pyyaml
          python scripts/check_plugin.py

      - name: 隐私扫描
        run: python scripts/privacy_scan.py --all

      - name: 配置文档与 schema 一致
        run: python scripts/gen_config_doc.py --check

      - name: 顶层导出完整（拆分防丢）
        run: python scripts/check_exports.py
      - name: 排版归一化（空格/换行/句号/感叹号）
        run: python scripts/test_typeset.py

      - name: 自检（纯函数，不联网）
        run: python astrbot_plugin/astrbot_plugin_fish/scripts/selfcheck.py
