name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 语法检查
        run: python -m compileall -q astrbot_plugin scripts

      - name: 插件结构 + 配置格式
        run: |
          pip install --quiet pyyaml
          python scripts/check_plugin.py

      - name: 隐私扫描
        run: python scripts/privacy_scan.py --all
